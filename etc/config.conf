# /etc/hosts-blacklist/config.conf
# Formato: CHAVE=valor (linhas com # são comentários).

# Endereço usado nas entradas de bloqueio. 0.0.0.0 é mais rápido que
# 127.0.0.1, pois não tenta conectar em nada local.
BLOCK_ADDRESS=0.0.0.0

# Também bloquear via IPv6 (acrescenta linhas ":: dominio").
BLOCK_IPV6=no
BLOCK_ADDRESS6=::

# Domínios por linha (1 a 9). 1 é o formato mais compatível.
HOSTS_PER_LINE=1

# Guarda uma cópia do hosts antes de cada alteração
# (/var/lib/hosts-blacklist/hosts.bak, mais hosts.orig da primeira execução).
BACKUP=yes

# Marca o /etc/hosts como imutável (chattr +i) depois de gravar.
# Atrapalha NetworkManager, Docker, cloud-init etc. Use só se precisar.
IMMUTABLE=no

# Permite fontes http:// (o padrão aceita somente https://).
ALLOW_HTTP=no

# Download das fontes
CURL_TIMEOUT=30
MAX_SOURCE_BYTES=52428800

# Validação: uma fonte nova é descartada (e a versão anterior mantida) se tiver
# menos que MIN_SOURCE_DOMAINS domínios válidos ou menos que MIN_SOURCE_RATIO %
# do tamanho da versão anterior.
MIN_SOURCE_DOMAINS=10
MIN_SOURCE_RATIO=50
